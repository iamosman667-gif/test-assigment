{% extends 'myapp/base.html' %}
{% block title %}Delete Car{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Delete Car</h1>
        <p>Are you sure you want to delete "{{ car }}"?</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'myapp:admin_cars' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
