{% extends 'myapp/base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Check Your Email</h1>
        <p>We've sent password reset instructions to your email. If you don't see it, check your spam folder.</p>
        <a href="{% url 'myapp:login' %}" class="btn btn-primary">Back to Login</a>
    </div>
</div>
{% endblock %}
