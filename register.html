{% extends 'myapp/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Register</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="auth-link">Already have an account? <a href="{% url 'myapp:login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
