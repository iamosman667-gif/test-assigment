{% extends 'myapp/base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Set New Password</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
